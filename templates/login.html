{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}

{% block body %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">

            <h1 class="mb-4 text-center">Login</h1>

            <!-- Formulário de login -->
            <form action="/login" method="post">
                <div class="mb-3">
                    <input autocomplete="off" autofocus class="form-control" name="username"
                        placeholder="Nome de usuário" type="text" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" name="password" placeholder="Senha" type="password" required>
                </div>
                <button class="btn btn-primary w-50 d-block mx-auto" type="submit">Entrar</button>
            </form>

            <!-- Link para cadastro -->
            <div class="mt-3">
                <p class="mb-0 text-center">Não tem uma conta? <a href="/register">Registre-se</a></p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
