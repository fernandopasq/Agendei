{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}

{% block body %}
<h1>Login</h1>
<!-- Form for login -->
<form action="/login" method="post">
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Nome de usuário"
            type="text" required>
    </div>
    <div class="mb-3">
        <input class="form-control mx-auto w-auto" name="password" placeholder="Senha" type="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Entrar</button>
</form>
<!-- Link for registration -->
<div class="mt-3">
    <p>Não tem uma conta? <a href="/register">Registre-se</a></p>
</div>{% endblock %}
