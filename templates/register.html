{% extends "layout.html" %}

{% block title %}
Registrar-se
{% endblock %}

{% block body %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h1 class="mb-4 text-center">Registrar-se</h1>

            <form action="/register" method="post">

                <!-- Group: Personal data -->
                <fieldset class="mb-4">
                    <legend class="fw-semibold mb-3">Dados Pessoais</legend>

                    <div class="mb-3">
                        <label for="name" class="form-label">Nome*</label>
                        <input autocomplete="off" autofocus class="form-control" id="name" name="name" placeholder="Nome" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label for="surename" class="form-label">Sobrenome*</label>
                        <input autocomplete="off" class="form-control" id="surename" name="surename" placeholder="Sobrenome" type="text" required>
                    </div>
                </fieldset>

                <!-- Group: Register info -->
                <fieldset class="mb-4">
                    <legend class="fw-semibold mb-3">Cadastro de Usuário</legend>

                    <div class="mb-3">
                        <label for="username" class="form-label">Nome de Usuário*</label>
                        <input autocomplete="off" class="form-control" id="username" name="username" placeholder="Nome de Usuário" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha*</label>
                        <input class="form-control" id="password" name="password" placeholder="Senha" type="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmation" class="form-label">Repita a Senha*</label>
                        <input class="form-control" id="confirmation" name="confirmation" placeholder="Repita a Senha" type="password" required>
                    </div>
                </fieldset>

                <button class="btn btn-primary w-50 d-block mx-auto" type="submit">Registrar</button>
            </form>

            <div class="mt-3">
                <p class="mb-0 text-center">Já tem uma conta? <a href="/login">Faça login</a></p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
